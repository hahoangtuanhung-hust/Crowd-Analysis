server:
  host: 0.0.0.0
  port: 8000
  upload_directory: data/uploads
  max_upload_mb: 500
  jpeg_quality: 82
  websocket_interval_ms: 250
  cors_origins:
    - http://localhost:5173

detector:
  provider: ultralytics
  model: yolo26n.pt
  imgsz: 1280
  confidence: 0.04
  iou: 0.55
  max_det: 1000
  classes: [0]
  device: auto
  precision: fp32
  tiled_inference: true
  tile_rows: 2
  tile_columns: 2
  tile_overlap: 0.20
  tile_merge_iou: 0.45
  tile_include_full_frame: true
  ignore_regions:
    - [0.00, 0.04, 0.09, 0.24]
    - [0.43, 0.04, 0.56, 0.23]
    - [0.80, 0.04, 0.95, 0.24]

tracker:
  type: bytetrack
  track_high_thresh: 0.08
  track_low_thresh: 0.04
  new_track_thresh: 0.08
  track_buffer: 180
  match_thresh: 0.80
  fuse_score: false
  association_mode: hybrid
  max_center_distance_ratio: 0.04
  second_match_thresh: 0.70
  lost_track_grace_frames: 8
  stationary_lost_track_grace_frames: 30
  stationary_speed_threshold: 2.0
  stationary_boost: true

video:
  inference_interval: 1
  queue_size: 4
  stale_frame_policy: drop_oldest
  reconnect_initial_seconds: 1.0
  reconnect_max_seconds: 30.0

analytics:
  grid_width: 64
  grid_height: 36
  trajectory_history_points: 150
  trajectory_smoothing_alpha: 0.35
  min_confirmed_points: 3
  max_active_tracks: 4096
  inactive_track_ttl_seconds: 15.0
  movement_threshold_pixels: 1.5
  max_movement_step_pixels: 250.0
  max_point_gap_seconds: 2.0
  current_window_seconds: 10
  live_retention_seconds: 300
  gaussian_sigma: 1.5
  path_grid_width: 8
  path_grid_height: 5
  max_route_cells: 32
  max_completed_paths: 4096
  zone_debounce_points: 2
  ddcrp_enabled: true
  ddcrp_alpha: 0.4
  ddcrp_spatial_scale: 75.0
  ddcrp_direction_weight: 0.6
  ddcrp_stationary_threshold: 12.0
  zones: []
