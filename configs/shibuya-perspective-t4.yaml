# REJECTED on the 2026-10-06 T4 test: 13.735 FPS but 70.34% fewer detections,
# 413 -> 126 unique IDs, and changed Common Paths. Diagnostic profile only.
extends: shibuya-t4-optimized.yaml

detector:
  tiled_inference: false
  perspective_regions:
    enabled: true
    strategy: full_frame_plus_far
    far:
      y_min: 0.0
      y_max: 0.38
      imgsz: 960
      tiles:
        rows: 1
        cols: 2

video:
  max_detector_images_per_batch: 6
