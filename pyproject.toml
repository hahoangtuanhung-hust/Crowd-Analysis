[project]
name = "crowd-analysis-demo"
version = "0.1.0"
description = "Realtime, anonymous crowd flow analysis demo"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<6",
  "pyarrow>=18,<24",
  "psutil>=6,<8",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "pyyaml>=6,<7",
  "ultralytics>=8.4.116,<9",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
crowd-track = "scripts.run_tracking:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[tool.pytest.ini_options]
addopts = "-q --basetemp=tmp/pytest"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
